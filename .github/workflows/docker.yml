# Builds the container image and pushes it to GHCR on every push to main.
#
# The image is published as ghcr.io/foxy1402/devin2proxy with :latest (while
# the push is on the default branch) and :sha-<commit> always, so a deployment
# can pin to a commit if it wants to. The README and compose.yaml reference
# the :latest tag.
#
# No registry secrets are configured: the workflow logs in to GHCR with the
# job's own GITHUB_TOKEN, which needs only the packages:write permission
# declared below. Private repositories additionally require the package to be
# linked to them once (Package settings → Manage access → this repository);
# for a public repository like this one the token is enough.

name: docker

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
